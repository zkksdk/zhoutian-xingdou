<script>
  /* 调试钩子：把运行期错误收集到 window.__errs（不影响运行，可删） */
  window.__errs = [];
  addEventListener('error', function (e) { window.__errs.push(String((e && (e.message || e.error)) || e)); });
  addEventListener('unhandledrejection', function (e) { window.__errs.push('rejection: ' + e.reason); });
</script>

</head>
